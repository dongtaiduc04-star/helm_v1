fullnameOverride: getlink-dtd
# This Secret is created directly in k3s by the Azure bootstrap and is never
# committed to Git. It authenticates pulls from the private GHCR packages.
imagePullSecrets:
  - name: ghcr-pull-secret
# These packages are produced by the app repository workflow and remain
# private. The workflow replaces every tag below with an immutable commit SHA.
images:
  frontend:
    repository: ghcr.io/dongtaiduc04-star/getlink-dtd-frontend
    tag: 31e138fa1217be3ab1663841fdce3a9c252edf45
    pullPolicy: IfNotPresent
  apiGateway:
    repository: ghcr.io/dongtaiduc04-star/getlink-dtd-api-gateway
    tag: 31e138fa1217be3ab1663841fdce3a9c252edf45
    pullPolicy: IfNotPresent
  authService:
    repository: ghcr.io/dongtaiduc04-star/getlink-dtd-auth-service
    tag: 31e138fa1217be3ab1663841fdce3a9c252edf45
    pullPolicy: IfNotPresent
  linkService:
    repository: ghcr.io/dongtaiduc04-star/getlink-dtd-link-service
    tag: 31e138fa1217be3ab1663841fdce3a9c252edf45
    pullPolicy: IfNotPresent
app:
  publicBaseUrl: https://getlink-azure.dongtaiduc.me
# k3s ships the local-path provisioner. Data remains on the VM's managed disk,
# so keep one application node and back up MySQL/avatar data before recreation.
mysql:
  persistence:
    storageClass: local-path
avatarPersistence:
  storageClass: local-path
# Cloudflare Tunnel forwards the original Host header to Traefik over the
# cluster network. TLS terminates at Cloudflare; no public Azure IP is needed.
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  host: getlink-azure.dongtaiduc.me
  tls:
    enabled: false
    secretName: ""
