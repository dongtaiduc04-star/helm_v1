name: Helm checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    name: Lint and render chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: Azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.3.0
      - name: Lint and render base and Azure examples
        shell: bash
        run: |
          set -euo pipefail
          chart=helm/getlink-dtd
          helm lint "$chart"
          helm template getlink-dtd "$chart" >/dev/null
          helm lint "$chart" -f "$chart/values-azure.yaml"
          helm template getlink-dtd "$chart" -f "$chart/values-azure.yaml" >/dev/null
