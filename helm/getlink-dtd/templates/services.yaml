{{- $root := . -}}
{{- range $component, $settings := dict "frontend" .Values.service.frontend "api-gateway" .Values.service.apiGateway "auth-service" .Values.service.authService "link-service" .Values.service.linkService }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "getlink-dtd.fullname" $root }}-{{ $component }}
  labels:
    {{- include "getlink-dtd.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  selector:
    {{- include "getlink-dtd.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: http
      port: {{ $settings.port }}
      targetPort: http
{{- end }}
